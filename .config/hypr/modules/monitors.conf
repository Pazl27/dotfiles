################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/

# JUST LAPTOP MONITOR SETUP
# use the laptop screen only 
# every connected monitor will mirror the laptop screen
monitor=eDP-1,1920x1080,auto,1
# monitor=eDP-1, preferred, auto, 1
monitor=,preferred,auto,1,mirror,eDP-1

# HOME MONITOR SETUP
# Dell (DP-5) — vertical on the LEFT (rotated 90° clockwise)
# After rotation, its width becomes 1200px (from original height)
# Placed at 0x0 (leftmost screen)
monitor = desc:Dell Inc. DELL U2412M 4RFMK55G1JVL, 1920x1200@60, 0x0, 1, transform,1

# Odyssey (DP-3) — main display on the RIGHT
# Needs to be placed right next to rotated Dell (which is 1200px wide after transform)
monitor = desc:Samsung Electric Company Odyssey G60SD HNAX700903, 2560x1440@120, 1200x0, 1, , 1
workspace = 1, monitor:desc:Samsung Electric Company Odyssey G60SD HNAX700903
workspace = 2, monitor:desc:Samsung Electric Company Odyssey G60SD HNAX700903
workspace = 3, monitor:desc:Samsung Electric Company Odyssey G60SD HNAX700903
workspace = 4, monitor:desc:Samsung Electric Company Odyssey G60SD HNAX700903
workspace = 5, monitor:desc:Samsung Electric Company Odyssey G60SD HNAX700903
workspace = 6, monitor:desc:Samsung Electric Company Odyssey G60SD HNAX700903
workspace = 7, monitor:desc:Samsung Electric Company Odyssey G60SD HNAX700903
workspace = 8, monitor:desc:Samsung Electric Company Odyssey G60SD HNAX700903
workspace = 9, monitor:desc:Samsung Electric Company Odyssey G60SD HNAX700903
workspace = 10, monitor:desc:Samsung Electric Company Odyssey G60SD HNAX700903

# Disable laptop screen
# happens automatically now with a script 
# monitor = eDP-1, disable
