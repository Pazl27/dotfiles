# Chromium blur fix
windowrule = no_blur ture, match:class ^()$, match:title ^()$

# --- File Pickers & Managers ---
windowrule = float true,match:class ^(xdg-desktop-portal-gtk)$
windowrule = size 1000 800, match:class ^(xdg-desktop-portal-gtk)$
windowrule = center true, match:class ^(xdg-desktop-portal-gtk)$
windowrule = float true,match:class ^(thunar)$
windowrule = size 1000 800, match:class ^(thunar)$
windowrule = center true, match:class ^(thunar)$
windowrule = float true,match:class ^(org.gnome.FileRoller)$

# --- Bluetooth ---
windowrule = float true, match:class (.blueman-manager-wrapped)
windowrule = size 1300 875, match:class (.blueman-manager-wrapped)

# --- IDEs ---
windowrule = float true, match:class ^(jetbrains-clion)$, match:title ^(Welcome to CLion)$
windowrule = float true, match:class ^(jetbrains-idea)$, match:title ^(Welcome to IntelliJ IDEA)$
windowrule = float true, match:class ^(jetbrains-rustrover)$, match:title ^(Welcome to RustRover)$
windowrule = opacity 1.2, match:class ^(jetbrains-studio)$
windowrule = opacity 1.2, match:class ^(jetbrains-idea)$
windowrule = opacity 1.2, match:class ^(jetbrains-rustrover)$

# --- KeePass2 ---
windowrule = float true, match:class ^(.*KeePass.*)$
windowrule = center true, match:class ^(.*KeePass.*)$
windowrule = center true, match:class ^(KeePass2)$, match:title ^(Open Database - Database.kdbx)$
windowrule = size 1000 600, match:class ^(.*KeePass.*)$, match:title ^(.*KeePass.*)$
windowrule = size 550 300, match:class ^(KeePass2)$, match:title ^(Open Database - Database.kdbx)$

# --- Utilities & Tools ---
windowrule = size 1000 800, match:class ^(Nsxiv)$, match:title ^(nsxiv)$
windowrule = center true, match:class ^(Nsxiv)$
windowrule = float true, match:class ^(Emulator)$
windowrule = float true, match:class ^(askai)$
windowrule = size 1300 875, match:class (askai)
windowrule = center true, match:class ^(askai)$
windowrule = float true, match:class ^(dropterm)$
windowrule = size 1300 875, match:class (dropterm)
windowrule = center true, match:class ^(dropterm)$
windowrule = float true, match:class ^(installer)$
windowrule = size 1300 875, match:class (installer)
windowrule = center true, match:class ^(installer)$

# --- Steam ---
windowrule = float true, match:class ^(steam)$, match:title ^(Friends List)$
windowrule = float true, match:class ^(steam)$, match:title ^(Steam Settings)$
windowrule = float true, match:class ^(steam)$, match:title ^(Settings)$
windowrule = float true, match:class ^(steam)$, match:title ^(.* - Chat)$
windowrule = float true, match:class ^(steam)$, match:title ^(Screenshot Manager)$
windowrule = float true, match:class ^(steam)$, match:title ^(.* - event)$
windowrule = float true, match:class ^(steam)$, match:title ^(.* - News)$
windowrule = float true, match:class ^(steam)$, match:title ^(.* - Community)$
windowrule = float true, match:class ^(steam)$, match:title ^(.* - Properties)$

# --- Network, Sound, & Misc ---
windowrule = float true, match:title ^(Select what to share)$
windowrule = float true, match:class (nm-connection-editor)
windowrule = size 600 400, match:class (nm-connection-editor)
windowrule = float true, match:class (org.pulseaudio.pavucontrol)
windowrule = size 500 400, match:class (org.pulseaudio.pavucontrol)
windowrule = float true, match:class (org.gnome.Calculator)

# --- Waybar ---
layerrule = blur true, match:namespace (waybar)
layerrule = ignore_alpha 0.5, match:namespace (waybar)

# --- SwayNC ---
layerrule = blur true, match:namespace (swaync-control-center)
layerrule = ignore_alpha 0.5, match:namespace swaync-control-center
layerrule = blur true, match:namespace (swaync-notification-window)
layerrule = ignore_alpha 0.5, match:namespace swaync-notification-window
layerrule = animation slide right, match:namespace (swaync-notification-window)

# --- Wlogout & Rofi ---
layerrule = blur true, match:namespace logout_dialog
layerrule = blur true, match:namespace rofi
layerrule = dim_around true, match:namespace rofi
layerrule = ignore_alpha 0, match:namespace rofi
layerrule = animation slide top, match:namespace rofi
