# nwg-display config files for monitor and workspace setup
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/workspaces.conf

source = ~/.config/hypr/modules/laptop.conf
source = ~/.config/hypr/modules/autostart.conf
source = ~/.config/hypr/modules/devices.conf
source = ~/.config/hypr/modules/envioment.conf
source = ~/.config/hypr/modules/keymaps.conf
source = ~/.config/hypr/modules/rules.conf
source = ~/.config/hypr/modules/plugins.conf

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general

general {
    layout = scrolling
    border_size = 3
    # green color:
    # col.active_border = rgb(89b482) rgb(1e2122) rgb(1e2122) rgb(89b482)
    col.active_border = rgb(DF4633) rgb(1e2122) rgb(1e2122) rgb(DF4633)

    col.inactive_border = rgb(24273A) rgb(24273A) rgb(24273A) rgb(27273A) 45deg

    gaps_in = 2
    gaps_out = 5
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 0.9

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)

    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 6 
        passes = 4
        ignore_opacity = true
        xray = true
        new_optimizations = true

    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = myBezier, 0.05, 0.9, 0.1, 1.05

    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 7, default, popin 80%
    animation = border, 1, 10, default
    animation = borderangle, 1, 8, default
    animation = fade, 1, 7, default
    animation = workspaces, 1, 6, default
    # for a vertical slide effect, for hyprscrolling
    animation = workspaces, 1, 5, default, slidevert
}

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    pseudotile = true # Master switch for pseudotiling. Enabling is bound to mainMod + P in the keybinds section below
    preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers (default: -1)
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}



monitor=eDP-1,1920x1080@60.00,0x0,1.00
